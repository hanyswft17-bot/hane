<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | SSSOINJ</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="top"><a class="brand" href="index.html"><span class="mark">S</span><span>SSSOINJ<small>ADMIN CONSOLE</small></span></a><nav><a href="index.html">عرض الموقع</a><a href="services.html">الخدمات</a><a href="login.html">دخول الحساب</a></nav></header><main class="page"><span class="eyebrow">إدارة المنصة</span><h1>لوحة تحكم الأدمن</h1><div class="notice"><span class="notice-icon">!</span><div><h3>دخول إداري محمي</h3><p>يجب تسجيل الدخول بحساب مُنح دور admin داخل قاعدة البيانات. لا تنشئ دور الأدمن من واجهة المتصفح.</p></div></div><div class="panel"><h3>تسجيل دخول الأدمن</h3><label>البريد الإلكتروني<input id="admin-email" type="email"></label><label>كلمة المرور<input id="admin-password" type="password"></label><button class="btn btn-gold" onclick="adminSignIn()">دخول لوحة الإدارة</button><button class="btn btn-outline" onclick="signOut()">تسجيل الخروج</button><p id="admin-message" class="message"></p></div><section id="admin-console" hidden><div class="section-head"><h2>إدارة الخدمات</h2><button class="btn btn-red" onclick="newService()">+ إضافة خدمة</button></div><div class="panel"><form id="service-form" onsubmit="saveService(event)"><input id="service-id" type="hidden"><label>اسم الخدمة<input id="service-name" required maxlength="100"></label><label>الرابط المختصر (slug)<input id="service-slug" required pattern="[a-z0-9-]+" placeholder="samsung-jtag"></label><label>السعر<input id="service-price" type="number" min="0" step="0.01" required></label><label>العملة<input id="service-currency" value="SDG" maxlength="8"></label><label>الوصف<textarea id="service-description" rows="3"></textarea></label><label>حقول إضافية مفصولة بفواصل<input id="service-fields" placeholder="IMEI, SN, موديل الجهاز"></label><label class="check"><input id="service-active" type="checkbox" checked> الخدمة فعالة</label><button class="btn btn-gold" type="submit">حفظ الخدمة</button><button class="btn btn-outline" type="button" onclick="newService()">مسح الحقول</button></form></div><div id="admin-services" class="grid"></div><div class="section-head"><h2>طلبات العملاء</h2><button class="btn btn-outline" onclick="loadAdminOrders()">تحديث الطلبات</button></div><div id="admin-orders" class="stack"></div><div class="section-head"><h2>طلبات الدفع</h2><button class="btn btn-outline" onclick="loadAdminPayments()">تحديث</button></div><div id="admin-payments" class="stack"></div><div class="section-head"><h2>إعدادات طرق الدفع</h2></div><div class="panel"><form id="payment-form" onsubmit="savePaymentMethod(event)"><label>اسم طريقة الدفع<input id="method-name" required></label><label>رقم الحساب<input id="method-account" required></label><label>اسم المستفيد<input id="method-beneficiary" required></label><label>تعليمات التحويل<textarea id="method-instructions" rows="2"></textarea></label><label class="check"><input id="method-active" type="checkbox" checked> مفعّلة</label><button class="btn btn-gold" type="submit">إضافة طريقة الدفع</button></form><div id="admin-methods" class="stack"></div></div></section></main><footer>© SSSOINJ · Admin</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/config.js"></script><script src="assets/app.js"></script></body></html>
